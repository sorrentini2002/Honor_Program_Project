<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Water Network Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="N30_Prior_gateway_3.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            background: #f8f9fa;
            color: #333;
        }
        #header { 
            padding: 16px 24px; 
            background: #1e293b; 
            color: white; 
            display: flex; 
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 30;
        }
        #header h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
        
        #global-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        #content { display: flex; flex: 1; overflow: hidden; position: relative; }
        #cy { width: 60%; height: 100%; background: white; position: relative; z-index: 10; }
        
        /* SPLITTER SUL MARGINE INTERATTIVO */
        #splitter {
            width: 6px;
            height: 100%;
            background: #cbd5e1;
            cursor: col-resize;
            z-index: 20;
            transition: background 0.15s;
            flex-shrink: 0;
            border-left: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
        }
        #splitter:hover, #splitter.dragging {
            background: #3b82f6;
        }
        
        /* SIDEBAR STRUTTURATA */
        #sidebar { 
            width: 40%; 
            height: 100%; 
            background: #f1f5f9;
            box-shadow: -2px 0 12px rgba(0,0,0,0.03);
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            z-index: 5;
        }
        
        .sidebar-inner {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            min-width: 380px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        /* CARD CONTROLLI SIMULAZIONE */
        .sim-control-card {
            background: white;
            margin: 16px;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .btn-group { display: flex; gap: 6px; align-items: center; }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-icon:hover { background: #f8fafc; border-color: #94a3b8; color: #0f172a; }
        .btn-icon:active { transform: scale(0.95); }
        
        .btn-icon#btn-toggle-play {
            background: #3b82f6;
            color: white;
            border-color: #2563eb;
            font-size: 13px;
        }
        .btn-icon#btn-toggle-play:hover { background: #2563eb; }
        .btn-icon#btn-toggle-play.playing { background: #475569; border-color: #334155; }
        .btn-icon#btn-toggle-play.playing:hover { background: #334155; }

        .speed-select-container {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 2px 8px 2px 12px;
            gap: 4px;
        }
        .speed-label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .speed-select {
            background: transparent;
            border: none;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            padding: 4px 4px;
        }

        .time-badge {
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            font-family: monospace;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
        }
        
        .timeline-container { width: 100%; display: flex; flex-direction: column; }
        .custom-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            margin: 6px 0;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.4);
        }
        .custom-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .selection-card {
            background: white;
            margin: 0 16px 16px 16px;
            padding: 14px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .selection-details { display: flex; flex-direction: column; gap: 2px; }
        .selection-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; font-weight: 700; }
        .selection-name { font-size: 15px; font-weight: 600; color: #1e293b; text-transform: none; }
        .selection-empty { font-style: italic; color: #94a3b8; font-size: 13px; text-align: center; width: 100%; padding: 4px 0; }

        /* CHART AREA — supporta sia single che multi-chart per le cisterne */
        .chart-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            flex-shrink: 0;
        }
        /* In modalità single chart, la card cresce a riempire lo spazio */
        .chart-area.single-chart .chart-card {
            flex: 1;
            min-height: 260px;
        }
        /* In modalità multi-chart (tank), ogni card ha altezza fissa */
        .chart-area.multi-chart .chart-card {
            height: 220px;
        }
        .chart-card .plot-panel {
            width: 100%;
            height: 100%;
        }

        .metric-box { 
            display: inline-flex; 
            flex-direction: column;
            padding: 8px 16px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 8px; 
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 110px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .metric-value { font-size: 14px; font-weight: 700; margin-top: 4px; color: #ffffff; }

        /* Mappa Legend */
        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: #334155;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            pointer-events: none;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-line { width: 24px; height: 3px; border-radius: 2px; }
        .legend-line.valve { background: #94a3b8; }
        .legend-line.valve-iot { background: #FF851B; border: 1px dashed #fff; }
        .legend-line.valve-agent { background: #9C27B0; }
    </style>
</head>
<body>

    <div id="header">
        <h2>Water Network Digital Twin</h2>
        <div id="global-metrics">
            <div class="metric-box" id="box-sat">Satisfaction <div class="metric-value" id="val-sat">-</div></div>
            <div class="metric-box" id="box-crisis">Crisis Ratio <div class="metric-value" id="val-crisis">-</div></div>
            <div class="metric-box" id="box-head">Source Head <div class="metric-value" id="val-head">-</div></div>
            <div class="metric-box" id="box-tanks">Active Tanks <div class="metric-value" id="val-tanks">-</div></div>
        </div>
    </div>

    <div id="content">
        <div id="cy">
            <div class="map-legend">
                <div style="font-weight:700;margin-bottom:8px;color:#1e293b;">Legend</div>
                <div class="legend-item"><div class="legend-line valve"></div> Normal Valve</div>
                <div class="legend-item"><div class="legend-line valve-iot" style="height:4px;"></div> IoT Tank Valve</div>
                <div class="legend-item"><div class="legend-line valve-agent" style="height:4px;"></div> Agent-Controlled Valve</div>
            </div>
        </div>
        <div id="splitter"></div>
        
        <div id="sidebar">
            <div class="sidebar-inner">
                <div class="sim-control-card">
                    <div class="control-row">
                        <div class="btn-group">
                            <button id="btn-toggle-play" class="btn-icon" title="Play / Pause">▶</button>
                            <button id="btn-stop" class="btn-icon" title="Stop / Reset">■</button>
                            <button id="btn-clear" class="btn-icon" title="Clear Selection">✕</button>
                            
                            <div class="speed-select-container">
                                <span class="speed-label">Speed</span>
                                <select id="speed-select" class="speed-select">
                                    <option value="400">0.5x</option>
                                    <option value="200" selected>1.0x</option>
                                    <option value="100">2.0x</option>
                                    <option value="50">4.0x</option>
                                    <option value="25">8.0x</option>
                                </select>
                            </div>
                        </div>
                        <div id="time-display" class="time-badge">0.00h</div>
                    </div>
                    <div class="timeline-container">
                        <input type="range" id="time-slider" class="custom-slider" min="0" max="100" value="0" step="1">
                    </div>
                </div>
                
                <div class="selection-card" id="selection-box">
                    <div class="selection-empty" id="selection-info">No element selected. Click on a node or link.</div>
                </div>
                
                <!-- ===== CHART AREA — dinamica single/multi ===== -->
                <div class="chart-area single-chart" id="chart-area">
                    <!-- I plot-panel sono generati dinamicamente da drawChart() -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let topology = null;
        let simData = null;
        let cy = null;
        let currentStepIdx = 0;
        let playInterval = null;
        let simulationSpeed = 200; 
        let selectedEntity = null; 
        let zeroDemandsNodes = new Set(); 
        let baseFitZoom = 1.0; 
        let maxSourceHead = 0.1;

        // -------------------------------------------------------
        // FEATURE E — Priorità Dinamica
        // Aggiungi o rimuovi IDs qui; se tutti i nodi attivi sono
        // in lista, le stelle scompaiono automaticamente.
        // -------------------------------------------------------
        let PRIORITY_NODES = [];  // Sarà impostato in startDashboard()

        // Mappa tank → valvola IoT associata (es. IoT_Tank_Small_0 → IoT_Valve_New_0)
        let tankValveMap = {};

        let ISOLATION_VALVES = [];

        // -------------------------------------------------------
        // Utilità
        // -------------------------------------------------------
        function getFormattedName(id, type) {
            if (type === 'Tank') {
                let numMatch = id.match(/\d+$/);
                let idNum = numMatch ? numMatch[0] : id;
                let sizeLetter = 'M'; 
                let lowerId = id.toLowerCase();
                if (lowerId.includes('small') || lowerId.includes('_s')) sizeLetter = 'S';
                else if (lowerId.includes('large') || lowerId.includes('_l')) sizeLetter = 'L';
                return `tank ${sizeLetter}${idNum}`;
            } 
            else if (type === 'Junction') {
                if (zeroDemandsNodes && zeroDemandsNodes.has(id)) return id; 
                if (PRIORITY_NODES.includes(id)) return `User ${id} ⭐`;
                return `User ${id}`; 
            } 
            else if (type === 'Reservoir') {
                return `Reservoir ${id}`;
            }
            else if (type === 'Gateway') {
                return `Gateway ${id}`;
            }
            return id;
        }

        function getColor(ratio) {
            ratio = Math.max(0, Math.min(1, ratio));
            const hue = ratio * 120; 
            return `hsl(${hue}, 90%, 35%)`; 
        }

        // -------------------------------------------------------
        // AVVIO
        // -------------------------------------------------------
        function startDashboard() {
            if (!window.topology || !window.simData) {
                alert("Error: data.js not loaded properly.");
                return;
            }

            topology = window.topology;
            simData = window.simData;

            window.topology = window.topology || { nodes: [], links: [], sensors: [], priority_nodes: [], isolation_valves: [] };
            ISOLATION_VALVES = window.topology.isolation_valves || [];

            // --- FEATURE E: definisci i nodi prioritari qui ---
            // Se l'array combacia con TUTTI i nodi attivi, le stelle
            // vengono soppresse automaticamente da applyPriorityStyles().
            PRIORITY_NODES = (topology.priority_nodes || []).map(String);
            if (!PRIORITY_NODES.length) {
                const fallbackPriorityNodes = ["Junction_1362", "Junction_1407", "Junction_1498", "Junction_1541", "Junction_1578"];
                PRIORITY_NODES = fallbackPriorityNodes.filter(id => topology.nodes.some(n => n.id === id));
            }

            maxSourceHead = 0.1;
            simData.forEach(step => {
                if (step.global_metrics && step.global_metrics.source_head > maxSourceHead)
                    maxSourceHead = step.global_metrics.source_head;
            });

            zeroDemandsNodes = new Set();
            let nodeDemands = {};
            let totalDemand = 0;
            let activeNodesCount = 0;

            topology.nodes.forEach(n => {
                if (n.type !== 'Junction') return;
                let maxExpected = 0;
                simData.forEach(step => {
                    if (step.nodes[n.id] && step.nodes[n.id].expected > maxExpected)
                        maxExpected = step.nodes[n.id].expected;
                });
                if (maxExpected < 1e-10) {
                    zeroDemandsNodes.add(n.id);
                } else {
                    nodeDemands[n.id] = maxExpected;
                    totalDemand += maxExpected;
                    activeNodesCount++;
                }
            });

            window.avgDemand = activeNodesCount > 0 ? (totalDemand / activeNodesCount) : 1.0;
            window.nodeDemands = nodeDemands;

            // Recuperiamo solo gli ID delle junction attive (domanda > 0) convertiti in stringa
            const activeJuncs = topology.nodes
                .filter(n => n.type === 'Junction' && !zeroDemandsNodes.has(n.id))
                .map(n => String(n.id));
                
            // Verifichiamo se l'intero gruppo di junction attive è presente nella lista prioritaria
            const allArePriority = activeJuncs.length > 0 && activeJuncs.every(id => PRIORITY_NODES.includes(id));
            
            // Se sono TUTTE prioritarie, svuotiamo la lista così nessun nodo mostrerà la forma speciale
            if (allArePriority) {
                PRIORITY_NODES = [];
            }
            
            // FEATURE A — costruisci mappa tank → valvola IoT associata
            tankValveMap = {};
            topology.links.forEach(l => {
                // Le valvole IoT hanno come source una cisterna
                const srcNode = topology.nodes.find(n => n.id === l.source);
                if (srcNode && srcNode.type === 'Tank' && l.type === 'Valve') {
                    tankValveMap[l.source] = l.id;   // es. IoT_Tank_Small_0 → IoT_Valve_New_0
                }
            });

            initDashboard();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startDashboard);
        } else {
            setTimeout(startDashboard, 100);
        }

        // -------------------------------------------------------
        // FEATURE E helper — stelle dinamiche
        // -------------------------------------------------------
        function computeEffectivePriority() {
            // Determina se TUTTI i nodi attivi sono prioritari
            // In tal caso restituisce lista vuota (nessuna stella)
            const activeJunctions = topology.nodes
                .filter(n => n.type === 'Junction' && !zeroDemandsNodes.has(n.id))
                .map(n => String(n.id));

            const allArePriority = activeJunctions.every(id => PRIORITY_NODES.includes(id));
            if (allArePriority && activeJunctions.length > 0) return [];
            return PRIORITY_NODES;
        }

        function applyPriorityStyles() {
            const effective = computeEffectivePriority();
            cy.nodes().forEach(n => {
                if (n.data('type') !== 'Junction') return;
                const id = n.id();
                if (effective.includes(id)) {
                    n.addClass('priority-node');
                    // Mantieni dimensione minima visibile per le stelle
                    if (n.data('size') < 28) n.data('size', 28);
                    // Aggiorna label con stella
                    n.data('label', `User ${id} ⭐`);
                } else {
                    n.removeClass('priority-node');
                    n.data('label', `User ${id}`);
                    // Ripristina label senza stella se era prioritario
                    if (!zeroDemandsNodes.has(id)) {
                        let sizeRatio = Math.max(0.4, Math.min((window.nodeDemands[id] || 0) / window.avgDemand, 2.5));
                        n.data('size', 12 * sizeRatio);
                    } else {
                        n.data('size', 6);
                    }
                }
            });
        }

        // -------------------------------------------------------
        // INIT DASHBOARD
        // -------------------------------------------------------
        function initDashboard() {
            const slider = document.getElementById('time-slider');
            slider.max = simData.length - 1;
            slider.addEventListener('input', e => setStep(parseInt(e.target.value)));

            const playBtn    = document.getElementById('btn-toggle-play');
            const stopBtn    = document.getElementById('btn-stop');
            const speedSelect = document.getElementById('speed-select');

            function startLoop() {
                playInterval = setInterval(() => {
                    let next = currentStepIdx + 1;
                    if (next >= simData.length) next = 0;
                    slider.value = next;
                    setStep(next);
                }, simulationSpeed);
            }

            playBtn.addEventListener('click', () => {
                if (playInterval) {
                    clearInterval(playInterval); playInterval = null;
                    playBtn.innerText = "▶"; playBtn.classList.remove('playing');
                } else {
                    playBtn.innerText = "⏸"; playBtn.classList.add('playing');
                    startLoop();
                }
            });

            stopBtn.addEventListener('click', () => {
                if (playInterval) { clearInterval(playInterval); playInterval = null; }
                playBtn.innerText = "▶"; playBtn.classList.remove('playing');
                slider.value = 0; setStep(0);
            });

            speedSelect.addEventListener('change', e => {
                simulationSpeed = parseInt(e.target.value);
                if (playInterval) { clearInterval(playInterval); startLoop(); }
            });

            // Splitter drag
            const splitter        = document.getElementById('splitter');
            const cyContainer     = document.getElementById('cy');
            const sidebarContainer = document.getElementById('sidebar');
            const mainContent     = document.getElementById('content');
            let isDragging = false;

            splitter.addEventListener('mousedown', () => {
                isDragging = true;
                splitter.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });
            document.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const rect = mainContent.getBoundingClientRect();
                let lw = Math.max(rect.width * 0.15, Math.min(e.clientX - rect.left, rect.width * 0.99));
                cyContainer.style.width     = `${(lw / rect.width) * 100}%`;
                sidebarContainer.style.width = `${((rect.width - lw) / rect.width) * 100}%`;
                if (cy) cy.resize();
                safeResizePlots();
            });
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    splitter.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    if (cy) cy.resize();
                    safeResizePlots();
                }
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                selectedEntity = null;
                document.getElementById('selection-box').innerHTML =
                    '<div class="selection-empty">No element selected. Click on a node or link.</div>';
                clearChartArea();
                if (cy) { cy.elements().unselect(); cy.fit(); }
            });

            // -------------------------------------------------------
            // COSTRUZIONE ELEMENTI CYTOSCAPE
            // -------------------------------------------------------
            let elements = [];

            topology.nodes.forEach(n => {
                let posX = n.x;
                let posY = -n.y;
                if (n.type === 'Tank') { posX += 30; posY -= 30; }

                let customLabel = getFormattedName(n.id, n.type);
                let nodeSize = 20;
                let classes = '';

                if (n.type === 'Tank') {
                    let tankSizeAttr = n.size || n.tank_size;
                    if (tankSizeAttr) {
                        let s = tankSizeAttr.toLowerCase();
                        if (s === 'small' || s === 's') nodeSize = 18;
                        else if (s === 'large' || s === 'l') nodeSize = 36;
                        else nodeSize = 26;
                    } else {
                        let idLower = n.id.toLowerCase();
                        if (idLower.includes('small') || idLower.includes('_s')) nodeSize = 18;
                        else if (idLower.includes('large') || idLower.includes('_l')) nodeSize = 36;
                        else nodeSize = 26;
                    }
                }
                else if (n.type === 'Reservoir') { nodeSize = 28; }
                else if (n.type === 'Junction') {
                    if (zeroDemandsNodes.has(n.id)) {
                        classes = 'zero-dot'; nodeSize = 6;
                    } else {
                        let sizeRatio = Math.max(0.4, Math.min((window.nodeDemands[n.id] || 0) / window.avgDemand, 2.5));
                        nodeSize = 12 * sizeRatio;
                    }
                    if (computeEffectivePriority().includes(n.id)) {
                        classes += ' priority-node';
                        nodeSize = Math.max(nodeSize, 18);
                    }
                }

                elements.push({
                    data: { id: n.id, type: n.type, label: customLabel, size: nodeSize },
                    classes: classes.trim(),
                    position: { x: posX, y: posY }
                });
            });

            topology.links.forEach(l => {
                let classes = '';
                if (l.type === 'Valve') {
                    if (ISOLATION_VALVES.includes(l.id)) {
                        classes = 'agent-valve-edge';
                    } else if (tankValveMap[l.source]) {
                        classes = 'iot-valve-edge';
                    }
                }
                elements.push({ data: { id: l.id, source: l.source, target: l.target, type: l.type }, classes: classes });
            });

            // FEATURE C — Aggiungi i gateway come nodi Cytoscape
            if (topology.gateways && topology.gateways.length > 0) {
                topology.gateways.forEach(gw => {
                    elements.push({
                        data: { id: gw.id, type: 'Gateway', label: gw.id, size: 26 },
                        classes: 'gateway-node',
                        position: { x: gw.x, y: -gw.y },
                        grabbable: false
                    });
                });
            }

            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                boxSelectionEnabled: false,
                autoungrabify: false,
                wheelSensitivity: 0.15,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': '',
                            'width': 'data(size)',
                            'height': 'data(size)',
                            'background-color': '#999',
                            'font-size': '8px',
                            'text-valign': 'top',
                            'text-halign': 'center',
                            'border-width': 1,
                            'border-color': '#333'
                        }
                    },
                    {
                        selector: 'node[type="Reservoir"]',
                        style: { 'shape': 'square', 'border-width': 2, 'border-color': '#004a8d' }
                    },
                    {
                        selector: 'node[type="Tank"]',
                        style: { 'shape': 'triangle', 'background-color': '#2ECC40', 'border-width': 2, 'border-color': '#1d8e1e' }
                    },
                    {
                        selector: 'node.zero-dot',
                        style: { 'background-color': '#777', 'label': '', 'border-width': 0 }
                    },
                    // FEATURE E — nodi prioritari con stella
                    {
                        selector: '.priority-node',
                        style: {
                            'shape': 'star',
                            'border-width': 3,
                            'border-color': '#eab308',
                            'border-opacity': 1
                        }
                    },
                    // FEATURE C — gateway con diamante blu
                    {
                        selector: '.gateway-node',
                        style: {
                            'shape': 'diamond',
                            'background-color': '#6366f1',
                            'border-width': 2,
                            'border-color': '#4338ca',
                            'font-size': '9px',
                            'font-weight': 700,
                            'color': '#312e81',
                            'text-valign': 'bottom',
                            'text-margin-y': 4
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 3,
                            'line-color': '#555',
                            'curve-style': 'bezier',
                            'control-point-step-size': 40,
                            'target-arrow-shape': 'none',
                            'opacity': 0.8
                        }
                    },
                    {
                        selector: 'edge[type="Valve"]',
                        style: {
                            'width': 4,
                            'line-style': 'solid',
                            'curve-style': 'bezier',
                            'control-point-step-size': 40,
                            'line-color': '#94a3b8'
                        }
                    },
                    {
                        selector: 'edge.iot-valve-edge',
                        style: {
                            'width': 5,
                            'line-style': 'dashed',
                            'line-color': '#FF851B'
                        }
                    },
                    {
                        selector: 'edge.agent-valve-edge',
                        style: {
                            'width': 5,
                            'line-style': 'solid',
                            'line-color': '#9C27B0'
                        }
                    }
                ],
                layout: { name: 'preset' }
            });

            cy.fit();
            baseFitZoom = cy.zoom();
            cy.minZoom(baseFitZoom * 0.9);

            // FEATURE E — applica stili stelle dopo init
            applyPriorityStyles();

            cy.on('tap', 'node', function(evt) {
                selectedEntity = { id: evt.target.id(), type: 'node', ntype: evt.target.data('type') };
                updateSelectionUI();
                drawChart();
                updateChartMarker();
            });

            cy.on('tap', 'edge', function(evt) {
                selectedEntity = { id: evt.target.id(), type: 'edge', etype: evt.target.data('type') };
                updateSelectionUI();
                drawChart();
                updateChartMarker();
            });

            setStep(0);
        }

        // -------------------------------------------------------
        // UI SELECTION
        // -------------------------------------------------------
        function updateSelectionUI() {
            const container = document.getElementById('selection-box');
            if (!selectedEntity) {
                container.innerHTML = '<div class="selection-empty">No element selected. Click on a node or link.</div>';
                return;
            }
            let title    = selectedEntity.type === 'node' ? 'Selected Node' : 'Selected Link';
            let subtitle = '';
            if (selectedEntity.type === 'node') {
                subtitle = getFormattedName(selectedEntity.id, selectedEntity.ntype);
                if (selectedEntity.ntype === 'Gateway') title = 'Selected Gateway';
            } else {
                subtitle = `${selectedEntity.id} — (${selectedEntity.etype})`;
            }
            container.innerHTML = `
                <div class="selection-details">
                    <span class="selection-title">${title}</span>
                    <span class="selection-name">${subtitle}</span>
                </div>
            `;
        }

        // -------------------------------------------------------
        // CHART UTILITIES
        // -------------------------------------------------------
        function clearChartArea() {
            const area = document.getElementById('chart-area');
            // Purge tutti i Plotly divs
            area.querySelectorAll('.plot-panel').forEach(el => {
                try { Plotly.purge(el); } catch(e) {}
            });
            area.innerHTML = '';
            area.className = 'chart-area single-chart';
        }

        function makePlotCard(id) {
            const card = document.createElement('div');
            card.className = 'chart-card';
            const panel = document.createElement('div');
            panel.id = id;
            panel.className = 'plot-panel';
            card.appendChild(panel);
            document.getElementById('chart-area').appendChild(card);
            return panel;
        }

        function safeResizePlots() {
            document.querySelectorAll('.plot-panel').forEach(el => {
                try { if (el.classList.contains('js-plotly-plot')) Plotly.Plots.resize(el); } catch(e) {}
            });
        }

        const customHover = 'orario: %{x:.0f}<br>value: %{y:.3f}<extra></extra>';

        const baseLayout = (title, yTitle, extra) => Object.assign({
            title: { text: title, font: { size: 13, family: 'inherit' } },
            xaxis: { title: 'Time (Hours)', gridcolor: '#f1f5f9', automargin: true },
            yaxis: { title: yTitle, gridcolor: '#f1f5f9', automargin: true },
            margin: { t: 44, l: 52, r: 36, b: 44 },
            plot_bgcolor: '#ffffff',
            paper_bgcolor: '#ffffff',
            legend: { orientation: 'h', y: -0.25 },
            hoverlabel: {
                bgcolor: '#1e293b', bordercolor: '#334155',
                font: { color: '#ffffff', size: 12, family: 'Segoe UI' }
            },
            shapes: []
        }, extra || {});

        const plotConfig = { responsive: true, displayModeBar: false };

        // -------------------------------------------------------
        // DRAW CHART — router principale
        // -------------------------------------------------------
        function drawChart() {
            if (!selectedEntity) return;
            clearChartArea();

            const timeAxis = simData.map(d => d.time_hours);
            const id       = selectedEntity.id;

            // ---- NODE ----
            if (selectedEntity.type === 'node') {
                const ntype = selectedEntity.ntype;
                const displayName = getFormattedName(id, ntype);

                if (ntype === 'Reservoir') {
                    // — Reservoir: head + crisis ratio (dual axis)
                    const panel = makePlotCard('plot-reservoir');
                    Plotly.newPlot(panel, [
                        {
                            x: timeAxis, y: simData.map(d => d.global_metrics.source_head),
                            name: 'Head (m)', mode: 'lines', line: { color: '#3b82f6', width: 2 },
                            hovertemplate: customHover
                        },
                        {
                            x: timeAxis, y: simData.map(d => d.global_metrics.crisis_ratio),
                            name: 'Crisis Ratio', mode: 'lines', yaxis: 'y2',
                            line: { color: '#ef4444', width: 2 }, hovertemplate: customHover
                        }
                    ], Object.assign(baseLayout(`${displayName} — Head & Crisis Ratio`, 'Head (m)'), {
                        yaxis2: { overlaying: 'y', side: 'right', showgrid: false, title: 'Crisis Ratio' }
                    }), plotConfig);
                }

                // FEATURE A — Tank: 3 grafici in sequenza con scroll
                else if (ntype === 'Tank') {
                    document.getElementById('chart-area').className = 'chart-area multi-chart';
                    const assocValve = tankValveMap[id]; // es. IoT_Valve_New_0

                    // 1) Livello acqua
                    const p1 = makePlotCard('plot-tank-level');
                    Plotly.newPlot(p1, [{
                        x: timeAxis, y: simData.map(d => d.tanks[id] || 0),
                        name: 'Level (m)', mode: 'lines', fill: 'tozeroy',
                        line: { color: '#10b981', width: 2.5 },
                        fillcolor: 'rgba(16,185,129,0.1)', hovertemplate: customHover
                    }], baseLayout(`${displayName} — Water Level`, 'Level (m)'), plotConfig);

                    // 2) Packet Loss sensore
                    const p2 = makePlotCard('plot-tank-pl');
                    if (assocValve) {
                        Plotly.newPlot(p2, [{
                            x: timeAxis,
                            y: simData.map(d => (d.sensor_packet_loss && d.sensor_packet_loss[assocValve] !== undefined)
                                ? d.sensor_packet_loss[assocValve] : null),
                            name: 'Packet Loss (%)', mode: 'lines', line: { color: '#f97316', width: 2 },
                            connectgaps: false, hovertemplate: customHover
                        }], baseLayout(`Sensor ${assocValve} — Packet Loss`, 'Packet Loss (%)'), plotConfig);
                    } else {
                        Plotly.newPlot(p2, [{
                            x: timeAxis,
                            y: simData.map(d => d.global_metrics.packet_loss),
                            name: 'Network PL (%)', mode: 'lines', line: { color: '#f97316', width: 2 },
                            hovertemplate: customHover
                        }], baseLayout(`${displayName} — Network Packet Loss`, 'Packet Loss (%)'), plotConfig);
                    }
                }

                // FEATURE C — Gateway: packet loss globale
                else if (ntype === 'Gateway') {
                    const panel = makePlotCard('plot-gateway');
                    Plotly.newPlot(panel, [{
                        x: timeAxis,
                        y: simData.map(d => d.global_metrics.packet_loss),
                        name: 'Network Packet Loss (%)', mode: 'lines',
                        line: { color: '#6366f1', width: 2.5 }, fill: 'tozeroy',
                        fillcolor: 'rgba(99,102,241,0.08)', hovertemplate: customHover
                    }], baseLayout(`${id} — Global Network Packet Loss`, 'Packet Loss (%)'), plotConfig);
                }

                else {
                    // Junction — demand
                    const panel = makePlotCard('plot-junction');
                    Plotly.newPlot(panel, [
                        {
                            x: timeAxis, y: simData.map(d => d.nodes[id] ? d.nodes[id].expected : 0),
                            name: 'Expected', mode: 'lines',
                            line: { dash: 'dash', color: '#94a3b8', width: 2 }, hovertemplate: customHover
                        },
                        {
                            x: timeAxis, y: simData.map(d => d.nodes[id] ? d.nodes[id].actual : 0),
                            name: 'Actual', mode: 'lines',
                            line: { color: '#3b82f6', width: 2 }, hovertemplate: customHover
                        }
                    ], baseLayout(`${getFormattedName(id, 'Junction')} — Water Demand`, 'Flow'), plotConfig);
                }
            }

            // ---- EDGE ----
            else {
                const etype = selectedEntity.etype;

                if (etype === 'Valve') {
                    const isAgent = ISOLATION_VALVES.includes(id);
                    const hasFlow = simData.some(d => d.pipes && d.pipes[id] !== undefined && d.pipes[id] !== null);

                    if (hasFlow || isAgent) {
                        const panel = makePlotCard('plot-valve-flow');
                        let traces = [];
                        
                        if (hasFlow) {
                            traces.push({
                                x: timeAxis, y: simData.map(d => d.pipes[id] || 0),
                                name: 'Flow', mode: 'lines',
                                line: { color: '#06b6d4', width: 2 }, hovertemplate: customHover
                            });
                        }
                        
                        if (isAgent) {
                            traces.push({
                                x: timeAxis, y: simData.map(d => (d.isolation_valve_settings && d.isolation_valve_settings[id]) ? d.isolation_valve_settings[id].setting : 1000.0),
                                name: 'K Setting', mode: 'lines', yaxis: 'y2',
                                line: { color: '#9C27B0', width: 2, dash: 'dot' }, hovertemplate: customHover
                            });
                        }

                        let layout = baseLayout(`Valve ${id} — Data`, 'Flow (m³/s)');
                        if (isAgent) {
                            layout.yaxis2 = {
                                title: 'Loss Coeff (K)',
                                overlaying: 'y',
                                side: 'right',
                                type: 'log',
                                gridcolor: 'rgba(148, 163, 184, 0.1)'
                            };
                        }

                        Plotly.newPlot(panel, traces, layout, plotConfig);
                    } else {
                        const area = document.getElementById('chart-area');
                        area.innerHTML = '<div style="padding:24px;color:#94a3b8;font-style:italic;">No data available for this valve.</div>';
                    }
                }

                else {
                    // Pipe — flusso standard
                    const panel = makePlotCard('plot-pipe');
                    Plotly.newPlot(panel, [{
                        x: timeAxis, y: simData.map(d => d.pipes[id] || 0),
                        name: 'Flow', mode: 'lines',
                        line: { color: '#6366f1', width: 2 }, hovertemplate: customHover
                    }], baseLayout(`Pipe ${id} — Flow Rate`, 'Flow (m³/s)'), plotConfig);
                }
            }
        }

        // -------------------------------------------------------
        // MARKER TIMELINE
        // -------------------------------------------------------
        function updateChartMarker() {
            if (!selectedEntity) return;
            const currentTime = simData[currentStepIdx].time_hours;
            const shapeUpdate = {
                shapes: [{
                    type: 'line',
                    x0: currentTime, y0: 0, x1: currentTime, y1: 1,
                    yref: 'paper',
                    line: { color: '#ef4444', width: 2, dash: 'dot' }
                }]
            };
            document.querySelectorAll('.plot-panel').forEach(el => {
                try {
                    if (el.classList.contains('js-plotly-plot'))
                        Plotly.relayout(el, shapeUpdate);
                } catch(e) {}
            });
        }

        // -------------------------------------------------------
        // SET STEP
        // -------------------------------------------------------
        function setStep(idx) {
            currentStepIdx = idx;
            const data = simData[idx];

            document.getElementById('time-display').innerText = `${data.time_hours.toFixed(2)}h`;

            const satValue = data.global_metrics.satisfaction_pct;
            document.getElementById('val-sat').innerText = satValue.toFixed(1) + '%';
            document.getElementById('box-sat').style.backgroundColor = getColor(satValue / 100.0);

            const crisisValue = data.global_metrics.crisis_ratio;
            document.getElementById('val-crisis').innerText = crisisValue.toFixed(2);
            document.getElementById('box-crisis').style.backgroundColor = getColor(crisisValue);

            const headValue = data.global_metrics.source_head;
            document.getElementById('val-head').innerText = headValue.toFixed(1) + ' m';
            document.getElementById('box-head').style.backgroundColor = getColor(Math.min(headValue / maxSourceHead, 1));

            const tanksValue = data.global_metrics.active_tanks;
            document.getElementById('val-tanks').innerText = tanksValue;
            document.getElementById('box-tanks').style.backgroundColor = getColor(Math.min(tanksValue / 10.0, 1));

            cy.batch(() => {
                // Zero-dot
                cy.nodes().forEach(n => {
                    const nid = n.id();
                    if (n.data('type') === 'Junction' && zeroDemandsNodes.has(nid)) {
                        n.addClass('zero-dot');
                    } else {
                        n.removeClass('zero-dot');
                    }
                });

                cy.nodes().forEach(n => {
                    const nid  = n.id();
                    const ntype = n.data('type');

                    if (ntype === 'Gateway') {
                        // I gateway mantengono il colore fisso
                        return;
                    }
                    if (ntype === 'Reservoir') {
                        n.style('background-color', getColor(data.global_metrics.crisis_ratio));
                    }
                    else if (ntype === 'Tank' && data.tanks[nid] !== undefined) {
                        n.style('background-color', getColor(Math.min(data.tanks[nid] / 10.0, 1.0)));
                    }
                    else if ((ntype === 'Junction' || ntype === 'Tank') && data.nodes[nid]) {
                        const { expected, actual } = data.nodes[nid];
                        const sat = expected > 1e-10 ? actual / expected : 1;
                        n.style('background-color', getColor(sat));
                    }
                    else {
                        n.style('background-color', '#999');
                    }
                });

                cy.edges().forEach(e => {
                    const eid = e.id();
                    if (data.pipes[eid] !== undefined) {
                        const flow = data.pipes[eid];
                        e.style('line-color', getColor(flow < 0 ? 0 : Math.min(flow / 0.05, 1.0)));
                    }
                    if (e.data('type') === 'Valve' && data.valves[eid]) {
                        if (ISOLATION_VALVES.includes(eid)) {
                            // Colore valvole agent-controlled
                            const isoSet = (data.isolation_valve_settings && data.isolation_valve_settings[eid]) ? data.isolation_valve_settings[eid].setting : 1000.0;
                            const isIsoOpen = isoSet < 10000;
                            e.style('line-color', isIsoOpen ? '#9C27B0' : '#4A148C'); // Purple vs Dark Purple
                        } else {
                            const isOpen = data.valves[eid].toLowerCase() === 'open';
                            e.style('line-color', isOpen ? '#2ECC40' : '#FF4136');
                        }
                    }
                });
            });

            updateChartMarker();
        }

    </script>
</body>
</html>
