<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Water Network Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="data.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            background: #f8f9fa;
            color: #333;
        }
        #header { 
            padding: 16px 24px; 
            background: #1e293b; 
            color: white; 
            display: flex; 
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 30;
        }
        #header h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
        
        #global-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        #content { display: flex; flex: 1; overflow: hidden; position: relative; }
        #cy { width: 60%; height: 100%; background: white; position: relative; z-index: 10; }
        
        /* SPLITTER SUL MARGINE INTERATTIVO */
        #splitter {
            width: 6px;
            height: 100%;
            background: #cbd5e1;
            cursor: col-resize;
            z-index: 20;
            transition: background 0.15s;
            flex-shrink: 0;
            border-left: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
        }
        #splitter:hover, #splitter.dragging {
            background: #3b82f6;
        }
        
        /* SIDEBAR STRUTTURATA */
        #sidebar { 
            width: 40%; 
            height: 100%; 
            background: #f1f5f9;
            box-shadow: -2px 0 12px rgba(0,0,0,0.03);
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            z-index: 5;
        }
        
        .sidebar-inner {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            min-width: 380px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        /* CARD CONTROLLI SIMULAZIONE */
        .sim-control-card {
            background: white;
            margin: 16px;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .btn-group { display: flex; gap: 6px; align-items: center; }
        
        /* Pulsanti Iconici Rotondi */
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-icon:hover { background: #f8fafc; border-color: #94a3b8; color: #0f172a; }
        .btn-icon:active { transform: scale(0.95); }
        
        .btn-icon#btn-toggle-play {
            background: #3b82f6;
            color: white;
            border-color: #2563eb;
            font-size: 13px;
        }
        .btn-icon#btn-toggle-play:hover { background: #2563eb; }
        .btn-icon#btn-toggle-play.playing { background: #475569; border-color: #334155; }
        .btn-icon#btn-toggle-play.playing:hover { background: #334155; }

        /* Dropdown per la velocità */
        .speed-select-container {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 2px 8px 2px 12px;
            gap: 4px;
        }
        .speed-label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .speed-select {
            background: transparent;
            border: none;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            padding: 4px 4px;
        }

        .time-badge {
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            font-family: monospace;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
        }
        
        /* Timeline Slider */
        .timeline-container { width: 100%; display: flex; flex-direction: column; }
        .custom-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            margin: 6px 0;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.4);
        }
        .custom-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .custom-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.4);
        }
        .custom-slider::-moz-range-thumb:hover { transform: scale(1.2); }

        /* Card informativa dell'elemento selezionato */
        .selection-card {
            background: white;
            margin: 0 16px 16px 16px;
            padding: 14px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .selection-details { display: flex; flex-direction: column; gap: 2px; }
        .selection-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; font-weight: 700; }
        .selection-name { font-size: 15px; font-weight: 600; color: #1e293b; text-transform: none; }
        .selection-empty { font-style: italic; color: #94a3b8; font-size: 13px; text-align: center; width: 100%; padding: 4px 0; }

        /* Area Grafico */
        .chart-card {
            flex: 1;
            background: white;
            margin: 0 16px 16px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #plot-div { flex: 1; width: 100%; height: 100%; }

        .metric-box { 
            display: inline-flex; 
            flex-direction: column;
            padding: 8px 16px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 8px; 
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 110px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .metric-value { font-size: 14px; font-weight: 700; margin-top: 4px; color: #ffffff; }
    </style>
</head>
<body>

    <div id="header">
        <h2>Water Network Digital Twin</h2>
        <div id="global-metrics">
            <div class="metric-box" id="box-sat">Satisfaction <div class="metric-value" id="val-sat">-</div></div>
            <div class="metric-box" id="box-crisis">Crisis Ratio <div class="metric-value" id="val-crisis">-</div></div>
            <div class="metric-box" id="box-head">Source Head <div class="metric-value" id="val-head">-</div></div>
            <div class="metric-box" id="box-tanks">Active Tanks <div class="metric-value" id="val-tanks">-</div></div>
        </div>
    </div>

    <div id="content">
        <div id="cy"></div>
        <div id="splitter"></div>
        
        <div id="sidebar">
            <div class="sidebar-inner">
                <div class="sim-control-card">
                    <div class="control-row">
                        <div class="btn-group">
                            <button id="btn-toggle-play" class="btn-icon" title="Play / Pause">▶</button>
                            <button id="btn-stop" class="btn-icon" title="Stop / Reset">■</button>
                            <button id="btn-clear" class="btn-icon" title="Clear Selection">✕</button>
                            
                            <div class="speed-select-container">
                                <span class="speed-label">Speed</span>
                                <select id="speed-select" class="speed-select">
                                    <option value="400">0.5x</option>
                                    <option value="200" selected>1.0x</option>
                                    <option value="100">2.0x</option>
                                    <option value="50">4.0x</option>
                                    <option value="25">8.0x</option>
                                </select>
                            </div>
                        </div>
                        <div id="time-display" class="time-badge">0.00h</div>
                    </div>
                    <div class="timeline-container">
                        <input type="range" id="time-slider" class="custom-slider" min="0" max="100" value="0" step="1">
                    </div>
                </div>
                
                <div class="selection-card" id="selection-box">
                    <div class="selection-empty" id="selection-info">No element selected. Click on a node or link.</div>
                </div>
                
                <div class="chart-card">
                    <div id="plot-div"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let topology = null;
        let simData = null;
        let cy = null;
        let currentStepIdx = 0;
        let playInterval = null;
        let simulationSpeed = 200; 
        let selectedEntity = null; 
        let zeroDemandsNodes = new Set(); 
        let baseFitZoom = 1.0; 
        let maxSourceHead = 0.1; 

        function getFormattedName(id, type) {
            if (type === 'Tank') {
                let numMatch = id.match(/\d+$/);
                let idNum = numMatch ? numMatch[0] : id;
                let sizeLetter = 'M'; 
                let lowerId = id.toLowerCase();
                if (lowerId.includes('small') || lowerId.includes('_s')) sizeLetter = 'S';
                else if (lowerId.includes('large') || lowerId.includes('_l')) sizeLetter = 'L';
                return `tank ${sizeLetter}${idNum}`;
            } 
            else if (type === 'Junction') {
                if (zeroDemandsNodes && zeroDemandsNodes.has(id)) {
                    return id; 
                }
                return `User ${id}`; 
            } 
            else if (type === 'Reservoir') {
                return `Reservoir ${id}`;
            }
            return id;
        }

        function startDashboard() {
            if (!window.topology || !window.simData) {
                alert("Error: data.js not loaded properly. Make sure data.js exists in the project root.");
                return;
            }
            topology = window.topology;
            simData = window.simData;
            
            maxSourceHead = 0.1;
            simData.forEach(step => {
                if(step.global_metrics && step.global_metrics.source_head > maxSourceHead) {
                    maxSourceHead = step.global_metrics.source_head;
                }
            });

            zeroDemandsNodes = new Set();
            topology.nodes.forEach(n => {
                if (n.type !== 'Junction') return; 
                let hasDemand = false;
                for (let step of simData) {
                    if (step.nodes[n.id]) {
                        const expected = step.nodes[n.id].expected;
                        const actual = step.nodes[n.id].actual;
                        if (expected > 0.01 || actual > 0.01) {
                            hasDemand = true;
                            break;
                        }
                    }
                }
                if (!hasDemand) {
                    zeroDemandsNodes.add(n.id);
                }
            });

            initDashboard();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startDashboard);
        } else {
            setTimeout(startDashboard, 100);
        }

        function initDashboard() {
            const slider = document.getElementById('time-slider');
            slider.max = simData.length - 1;
            
            slider.addEventListener('input', (e) => {
                setStep(parseInt(e.target.value));
            });

            const playBtn = document.getElementById('btn-toggle-play');
            const stopBtn = document.getElementById('btn-stop');
            const speedSelect = document.getElementById('speed-select');

            function startLoop() {
                playInterval = setInterval(() => {
                    let next = currentStepIdx + 1;
                    if(next >= simData.length) next = 0;
                    slider.value = next;
                    setStep(next);
                }, simulationSpeed);
            }

            playBtn.addEventListener('click', () => {
                if(playInterval) {
                    clearInterval(playInterval);
                    playInterval = null;
                    playBtn.innerText = "▶";
                    playBtn.classList.remove('playing');
                } else {
                    playBtn.innerText = "⏸";
                    playBtn.classList.add('playing');
                    startLoop();
                }
            });

            stopBtn.addEventListener('click', () => {
                if(playInterval) {
                    clearInterval(playInterval);
                    playInterval = null;
                }
                playBtn.innerText = "▶";
                playBtn.classList.remove('playing');
                slider.value = 0;
                setStep(0);
            });

            speedSelect.addEventListener('change', (e) => {
                simulationSpeed = parseInt(e.target.value);
                if (playInterval) {
                    clearInterval(playInterval);
                    startLoop();
                }
            });

            // LOGICA DI TRASCINAMENTO DELLO SPLITTER
            const splitter = document.getElementById('splitter');
            const cyContainer = document.getElementById('cy');
            const sidebarContainer = document.getElementById('sidebar');
            const mainContent = document.getElementById('content');
            let isDragging = false;

            splitter.addEventListener('mousedown', (e) => {
                isDragging = true;
                splitter.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const containerRect = mainContent.getBoundingClientRect();
                let leftWidth = e.clientX - containerRect.left;
                
                const minLeft = containerRect.width * 0.15;
                const maxLeft = containerRect.width * 0.99;
                
                if (leftWidth < minLeft) leftWidth = minLeft;
                if (leftWidth > maxLeft) leftWidth = maxLeft;
                
                const leftPercent = (leftWidth / containerRect.width) * 100;
                const rightPercent = 100 - leftPercent;
                
                cyContainer.style.width = `${leftPercent}%`;
                sidebarContainer.style.width = `${rightPercent}%`;
                
                if (cy) cy.resize();
                try {
                    if (document.getElementById('plot-div').classList.contains('js-plotly-plot')) {
                        Plotly.Plots.resize('plot-div');
                    }
                } catch(err) {}
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    splitter.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    if (cy) cy.resize();
                    try {
                        if (document.getElementById('plot-div').classList.contains('js-plotly-plot')) {
                            Plotly.Plots.resize('plot-div');
                        }
                    } catch(err) {}
                }
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                selectedEntity = null;
                document.getElementById('selection-box').innerHTML = '<div class="selection-empty">No element selected. Click on a node or link.</div>';
                Plotly.purge('plot-div');
                document.getElementById('plot-div').innerHTML = '';
                
                if (cy) {
                    cy.elements().unselect(); 
                    cy.fit(); 
                }
            });

            let elements = [];
            
            topology.nodes.forEach(n => {
                let posX = n.x;
                let posY = -n.y;

                if (n.type === 'Tank') {
                    posX += 30;
                    posY -= 30;
                }

                let sizeClass = 'tank-medium'; 
                let tankSizeAttr = n.size || n.tank_size; 

                if (tankSizeAttr) {
                    let s = tankSizeAttr.toLowerCase();
                    if (s === 'small' || s === 's') sizeClass = 'tank-small';
                    else if (s === 'large' || s === 'l') sizeClass = 'tank-large';
                } else {
                    let idLower = n.id.toLowerCase();
                    if (idLower.includes('small') || idLower.includes('_s')) sizeClass = 'tank-small';
                    else if (idLower.includes('large') || idLower.includes('_l')) sizeClass = 'tank-large';
                }

                let customLabel = getFormattedName(n.id, n.type);

                elements.push({
                    data: { id: n.id, type: n.type, label: customLabel, sizeClass: sizeClass },
                    position: { x: posX, y: posY }
                });
            });

            topology.links.forEach(l => {
                elements.push({
                    data: { id: l.id, source: l.source, target: l.target, type: l.type }
                });
            });

            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                boxSelectionEnabled: false, 
                autoungrabify: false, 
                wheelSensitivity: 0.15, 
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(label)',
                            'width': 20,
                            'height': 20,
                            'background-color': '#999',
                            'font-size': '8px',
                            'text-valign': 'top',
                            'text-halign': 'center',
                            'border-width': 1,
                            'border-color': '#333'
                        }
                    },
                    {
                        selector: 'node[type="Res"]', 
                        style: {
                            'shape': 'square',
                            'width': 28,
                            'height': 28,
                            'border-width': 2,
                            'border-color': '#004a8d'
                        }
                    },
                    {
                        selector: 'node[type="Reservoir"]',
                        style: {
                            'shape': 'square',
                            'width': 28,
                            'height': 28,
                            'border-width': 2,
                            'border-color': '#004a8d'
                        }
                    },
                    {
                        selector: 'node[type="Tank"]',
                        style: {
                            'shape': 'triangle',
                            'background-color': '#2ECC40',
                            'border-width': 2,
                            'border-color': '#1d8e1e'
                        }
                    },
                    {
                        selector: 'node[type="Tank"][sizeClass="tank-small"]',
                        style: {
                            'width': 18,
                            'height': 18
                        }
                    },
                    {
                        selector: 'node[type="Tank"][sizeClass="tank-medium"]',
                        style: {
                            'width': 26,
                            'height': 26
                        }
                    },
                    {
                        selector: 'node[type="Tank"][sizeClass="tank-large"]',
                        style: {
                            'width': 36,
                            'height': 36
                        }
                    },
                    {
                        selector: 'node.zero-dot',
                        style: {
                            'width': 6,
                            'height': 6,
                            'background-color': '#777',
                            'label': '',
                            'border-width': 0
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 3,
                            'line-color': '#555',
                            'curve-style': 'bezier',
                            'control-point-step-size': 40,
                            'target-arrow-shape': 'none',
                            'opacity': 0.8
                        }
                    },
                    {
                        selector: 'edge[type="Valve"]',
                        style: {
                            'width': 5,
                            'line-style': 'dashed',
                            'curve-style': 'bezier',
                            'control-point-step-size': 40,
                            'line-color': '#FF851B'
                        }
                    }
                ],
                layout: { name: 'preset' }
            });

            cy.fit();
            baseFitZoom = cy.zoom();
            cy.minZoom(baseFitZoom * 0.9); 

            cy.on('tap', 'node', function(evt){
                selectedEntity = { id: evt.target.id(), type: 'node', ntype: evt.target.data('type') };
                updateSelectionUI();
                drawChart();
                updateChartMarker();
            });

            cy.on('tap', 'edge', function(evt){
                selectedEntity = { id: evt.target.id(), type: 'edge', etype: evt.target.data('type') };
                updateSelectionUI();
                drawChart();
                updateChartMarker();
            });

            setStep(0);
        }

        function updateSelectionUI() {
            const container = document.getElementById('selection-box');
            if(!selectedEntity) {
                container.innerHTML = '<div class="selection-empty">No element selected. Click on a node or link.</div>';
                return;
            }
            
            let title = selectedEntity.type === 'node' ? 'Selected Node' : 'Selected Link';
            let subtitle = '';

            if (selectedEntity.type === 'node') {
                subtitle = getFormattedName(selectedEntity.id, selectedEntity.ntype);
            } else {
                subtitle = `${selectedEntity.id} — (${selectedEntity.etype})`;
            }
            
            container.innerHTML = `
                <div class="selection-details">
                    <span class="selection-title">${title}</span>
                    <span class="selection-name">${subtitle}</span>
                </div>
            `;
        }

        function getColor(ratio) {
            ratio = Math.max(0, Math.min(1, ratio));
            const hue = ratio * 120; 
            return `hsl(${hue}, 90%, 35%)`; 
        }

        function setStep(idx) {
            currentStepIdx = idx;
            const data = simData[idx];
            
            document.getElementById('time-display').innerText = `${data.time_hours.toFixed(2)}h`;
            
            const satValue = data.global_metrics.satisfaction_pct;
            document.getElementById('val-sat').innerText = satValue.toFixed(1) + '%';
            document.getElementById('box-sat').style.backgroundColor = getColor(satValue / 100.0);

            const crisisValue = data.global_metrics.crisis_ratio;
            document.getElementById('val-crisis').innerText = crisisValue.toFixed(2);
            document.getElementById('box-crisis').style.backgroundColor = getColor(crisisValue);

            const headValue = data.global_metrics.source_head;
            document.getElementById('val-head').innerText = headValue.toFixed(1) + ' m';
            const normHead = Math.max(0, Math.min(1, headValue / maxSourceHead));
            document.getElementById('box-head').style.backgroundColor = getColor(normHead);

            const tanksValue = data.global_metrics.active_tanks;
            document.getElementById('val-tanks').innerText = tanksValue;
            const normTanks = Math.max(0, Math.min(1, tanksValue / 10.0));
            document.getElementById('box-tanks').style.backgroundColor = getColor(normTanks);

            cy.batch(() => {
                cy.nodes().forEach(n => {
                    const nid = n.id();
                    const ntype = n.data('type');
                    if (ntype === 'Junction' && zeroDemandsNodes.has(nid)) {
                        n.addClass('zero-dot');
                    } else {
                        n.removeClass('zero-dot');
                    }
                });

                cy.nodes().forEach(n => {
                    const id = n.id();
                    const type = n.data('type');
                    
                    if (type === 'Reservoir') {
                        n.style('background-color', getColor(data.global_metrics.crisis_ratio));
                    }
                    else if (type === 'Tank' && data.tanks[id] !== undefined) {
                        const level = data.tanks[id];
                        const ratio = Math.min(level / 10.0, 1.0); 
                        n.style('background-color', getColor(ratio));
                    }
                    else if ((type === 'Junction' || type === 'Tank') && data.nodes[id]) {
                        const expected = data.nodes[id].expected;
                        const actual = data.nodes[id].actual;
                        let sat = 1;
                        if (expected > 0.01) sat = actual / expected;
                        n.style('background-color', getColor(sat));
                    }
                    else {
                        n.style('background-color', '#999');
                    }
                });

                cy.edges().forEach(e => {
                    const id = e.id();
                    if(data.pipes[id] !== undefined) {
                        const flow = data.pipes[id];
                        const normFlow = flow < 0 ? 0 : Math.min(flow / 50.0, 1.0);
                        e.style('line-color', getColor(normFlow));
                    }
                    if(e.data('type') === 'Valve' && data.valves[id]) {
                        const isOpen = data.valves[id].toLowerCase() === 'open';
                        e.style('line-color', isOpen ? '#2ECC40' : '#FF4136');
                    }
                });
            });

            updateChartMarker();
        }

        function drawChart() {
            if(!selectedEntity) return;

            const timeAxis = simData.map(d => d.time_hours);
            const id = selectedEntity.id;
            let traces = [];
            let title = "";

            const customHoverTemplate = 'orario: %{x:.0f}<br>value: %{y:.2f}<extra></extra>';

            if (selectedEntity.type === 'node') {
                let displayName = getFormattedName(id, selectedEntity.ntype);
                
                if (selectedEntity.ntype === 'Reservoir') {
                    title = `${displayName} - Head & Crisis Ratio`;
                    traces.push({
                        x: timeAxis, y: simData.map(d => d.global_metrics.source_head),
                        name: 'Head (m)', mode: 'lines', line: { color: '#3b82f6', width: 2 },
                        hovertemplate: customHoverTemplate
                    });
                    traces.push({
                        x: timeAxis, y: simData.map(d => d.global_metrics.crisis_ratio),
                        name: 'Crisis Ratio', mode: 'lines', yaxis: 'y2', line: { color: '#ef4444', width: 2 },
                        hovertemplate: customHoverTemplate
                    });
                }
                else if (selectedEntity.ntype === 'Tank') {
                    title = `${displayName} - Water Level`;
                    traces.push({
                        x: timeAxis, y: simData.map(d => d.tanks[id] || 0),
                        name: 'Level (m)', mode: 'lines', line: { color: '#10b981', width: 2.5 },
                        hovertemplate: customHoverTemplate
                    });
                }
                else { 
                    title = `${displayName} - Water Demand`;
                    traces.push({
                        x: timeAxis, y: simData.map(d => d.nodes[id] ? d.nodes[id].expected : 0),
                        name: 'Expected', mode: 'lines', line: {dash: 'dash', color: '#94a3b8', width: 2},
                        hovertemplate: customHoverTemplate
                    });
                    traces.push({
                        x: timeAxis, y: simData.map(d => d.nodes[id] ? d.nodes[id].actual : 0),
                        name: 'Actual', mode: 'lines', line: { color: '#3b82f6', width: 2 },
                        hovertemplate: customHoverTemplate
                    });
                }
            } else { 
                if (selectedEntity.etype === 'Valve') {
                    title = `Valve ${id} - State`;
                    traces.push({
                        x: timeAxis, 
                        y: simData.map(d => (d.valves[id] && d.valves[id].toLowerCase() === 'open') ? 1 : 0),
                        name: 'State (1=Open)', mode: 'lines', line: {shape: 'hv', color: '#f97316', width: 2.5},
                        hovertemplate: customHoverTemplate
                    });
                } else {
                    title = `Pipe ${id} - Flow Rate`;
                    traces.push({
                        x: timeAxis, y: simData.map(d => d.pipes[id] || 0),
                        name: 'Flow', mode: 'lines', line: { color: '#6366f1', width: 2 },
                        hovertemplate: customHoverTemplate
                    });
                }
            }

            const layout = {
                title: { text: title, font: { size: 14, weight: 'bold', family: 'inherit' } },
                xaxis: { title: 'Time (Hours)', gridcolor: '#f1f5f9' },
                yaxis: { title: 'Value', gridcolor: '#f1f5f9' },
                yaxis2: { overlaying: 'y', side: 'right', showgrid: false },
                margin: { t: 50, l: 50, r: 50, b: 50 },
                plot_bgcolor: '#ffffff',
                paper_bgcolor: '#ffffff',
                legend: { orientation: 'h', y: -0.2 },
                hoverlabel: {
                    bgcolor: '#1e293b',
                    bordercolor: '#334155',
                    font: { color: '#ffffff', size: 12, family: 'Segoe UI' }
                },
                shapes: [] 
            };

            Plotly.newPlot('plot-div', traces, layout, {responsive: true, displayModeBar: false});
        }

        function updateChartMarker() {
            if(!selectedEntity) return;
            const currentTime = simData[currentStepIdx].time_hours;
            
            const update = {
                shapes: [{
                    type: 'line',
                    x0: currentTime, y0: 0,
                    x1: currentTime, y1: 1,
                    yref: 'paper',
                    line: { color: '#ef4444', width: 2, dash: 'dot' }
                }]
            };
            Plotly.relayout('plot-div', update);
        }

    </script>
</body>
</html>
